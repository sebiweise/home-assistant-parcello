name: Fehler melden / Bug report
description: Etwas funktioniert nicht wie erwartet.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Meldung! Bitte entferne vor dem Absenden **Passwörter, E-Mail-Adressen, Sendungsnummern und Adressen** aus Logs.
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert und was hast du erwartet?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      multiple: true
      options:
        - Anmeldung / Einrichtung
        - Optionen
        - Status einer Sendung
        - Zustellfenster / Kalender
        - Services (Sendung hinzufügen / entfernen)
        - Events
        - Sonstiges
    validations:
      required: true
  - type: input
    id: carrier
    attributes:
      label: Paketdienst
      placeholder: "DHL"
  - type: input
    id: integration_version
    attributes:
      label: Version der Integration
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home-Assistant-Version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installationsart
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Debug-Logging aktivieren unter Einstellungen → Geräte & Dienste → Parcello → „Debug-Protokollierung aktivieren“.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnose (optional)
      description: |
        Einstellungen → Geräte & Dienste → Parcello → ⋮ → „Diagnose herunterladen“. Anmeldedaten, Sendungsnummern, Namen und Orte sind darin bereits entfernt.
      render: json
