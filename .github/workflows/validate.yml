name: Validate

on:
  push:
    branches:
      - master
  pull_request:
  # Weekly: catches new Home Assistant releases breaking the integration
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Same commands as locally (single source of truth); setup-python
      # puts its interpreter first on PATH as python3.
      - name: Install locked dependencies
        run: scripts/setup
      - name: Lint and test
        run: scripts/test

  tests-min:
    # The oldest Home Assistant release in hacs.json, see scripts/lock_min.
    name: Tests (minimum Home Assistant version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        # Wheels only, hash-checked; these older releases have no wheel.
        run: |
          python -m pip install --only-binary :all: \
            --no-binary mock-open,pyric,fnvhash,paho-mqtt \
            --require-hashes --no-deps -r requirements_test_min.txt
      - run: pytest -q
